services:
    web:
        image: nginx:latest
        expose:
            - "80"
        depends_on:
            php:
                condition: service_healthy
        environment:
            - VIRTUAL_HOST=spark.localhost
            - CLIENT_MAX_BODY_SIZE=100m
        volumes:
            - .:/var/www/html
            - ./docker/web/nginx-site.conf:/etc/nginx/conf.d/default.conf
        networks:
            default:
            nginx-proxy:

    php:
        image: php-fpm:latest
        build: docker/build/php-fpm
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/php.ini
        ports:
            - "8080:8080"
        networks:
            default:

    mysql:
        ports:
            - "2345:3306"
        image: mysql:latest
        #command: --mysql-native-password=ON  --log-bin-trust-function-creators=1
        #command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
        working_dir: /tmp/proj
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - spark_db:/var/lib/mysql
            - ./docker/local:/tmp/proj
        networks:
            - default

    redis:
        image: redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        networks:
            - default

    db-backup:
        image: mysql:latest
        depends_on:
            - mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - ./backups:/backups
        networks:
            - default
        entrypoint: >
            /bin/sh -c "
            echo 'DB backup service ready. Run manually:';
            echo '  docker compose run --rm db-backup mysqldump -h mysql -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE > /backups/spark_$$(date +%Y%m%d_%H%M%S).sql';
            echo 'Or use the backup script: make db-backup';
            tail -f /dev/null
            "
        profiles:
            - backup

    node:
        image: node:spark
        build: docker/build/npm
        user: node
        working_dir: /var/www/html
        ports:
          - "5173:5173"
        volumes:
          - .:/var/www/html

volumes:
    spark_db:
    redis_data:

networks:
    default:
    nginx-proxy:
        external: true
